<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad Tattoo Productions</title>
<meta name="description" content="Bad Tattoo Productions is a Denver production company for film, video and branded content.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Bad Tattoo Productions">
<meta property="og:description" content="Film · Video · Branded Content. Denver, Colorado.">
<meta property="og:image" content="https://badtattooproductions.com/assets/og-image.png">
<meta property="og:url" content="https://badtattooproductions.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#141210; --paper:#FFFFFF; --muted:#5E564C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
  }
  header, footer {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 24px clamp(16px, 4vw, 48px);
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  a { color: var(--ink); text-decoration: none; }
  a:hover, a:focus-visible { color: var(--muted); }
  nav a { padding: 12px 0; display: inline-block; }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: clamp(16px, 2.5vw, 32px);
    padding-bottom: 24px;
  }
  h1 { margin: 0; display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.2vw, 28px); }
  .mark { width: min(920px, 86vw); height: auto; display: block; margin: 0 auto; }
  .sub {
    font-size: clamp(13px, 2vw, 26px); font-weight: 600;
    letter-spacing: 0.42em; padding-left: 0.42em; text-transform: uppercase;
  }
  .tag { margin: 0; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 0 16px; line-height: 2; }
  footer { color: var(--muted); }
  @media (max-width: 520px) {
    footer { flex-direction: column; gap: 8px; text-align: center; }
  }
</style>
</head>
<body>
  <header>
    <span></span>
    <nav><a href="contact.html">Contact</a></nav>
  </header>
  <main>
    <h1>
      <img class="mark" src="assets/bad-black.svg" alt="Bad">
      <span class="sub">Tattoo Productions</span>
    </h1>
    <p class="tag">Film · Video · Branded Content</p>
  </main>
  <footer>
    <span>Denver, Colorado</span>
    <a href="mailto:connor@badtattooproductions.com">connor@badtattooproductions.com</a>
  </footer>
</body>
</html>
