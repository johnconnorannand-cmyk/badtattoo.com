<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Bad Tattoo Productions</title>
<meta name="description" content="Get in touch with Bad Tattoo Productions about a film, video or branded content project.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#141210; --paper:#FFFFFF; --muted:#5E564C; --line:#8A837B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header, footer {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 24px clamp(16px, 4vw, 48px);
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  a { color: var(--ink); text-decoration: none; }
  a:hover, a:focus-visible { color: var(--muted); }
  nav a { padding: 12px 0; display: inline-block; }
  .home { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .home img { width: 120px; height: auto; display: block; }
  .home span { font-size: 9px; font-weight: 600; letter-spacing: 0.38em; }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { margin: 0 0 12px; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .lede { margin: 0 0 40px; color: var(--muted); line-height: 1.6; }
  .lede a { color: var(--ink); border-bottom: 1px solid var(--ink); }
  form { display: flex; flex-direction: column; gap: 20px; }
  label { display: flex; flex-direction: column; gap: 8px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  input, textarea {
    font: inherit; font-size: 16px; letter-spacing: normal; text-transform: none;
    color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); }
  textarea { min-height: 160px; resize: vertical; }
  button {
    align-self: flex-start; min-height: 48px; padding: 0 28px; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--paper); background: var(--ink); border: 0; border-radius: 2px;
  }
  button:hover, button:focus-visible { background: #3D3832; }
  .hp { position: absolute; left: -9999px; }
  footer { color: var(--muted); }
  @media (max-width: 520px) { footer { flex-direction: column; text-align: center; gap: 8px; } }
</style>
</head>
<body>
  <header>
    <a class="home" href="index.html" aria-label="Bad Tattoo Productions home">
      <img src="assets/bad-black.svg" alt="">
      <span>Tattoo Productions</span>
    </a>
    <nav><a href="index.html">Home</a></nav>
  </header>
  <main>
    <h1>Contact</h1>
    <p class="lede">Tell us about your project, or email <a href="mailto:connor@badtattooproductions.com">connor@badtattooproductions.com</a> directly.</p>
    <!-- Replace YOUR_FORM_ID with the ID from your Formspree form (formspree.io/f/xxxxxxx) -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label>Name <input type="text" name="name" autocomplete="name" required></label>
      <label>Email <input type="email" name="email" autocomplete="email" required></label>
      <label>Company <input type="text" name="company" autocomplete="organization"></label>
      <label>Project details <textarea name="message" required></textarea></label>
      <input type="hidden" name="_subject" value="New inquiry: badtattooproductions.com">
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Send</button>
    </form>
  </main>
  <footer>
    <span>Denver, Colorado</span>
    <span>© 2026 Bad Tattoo Productions LLC</span>
  </footer>
</body>
</html>
